services:
  db:
    image: mariadb:10.11
    container_name: omnipost_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-omnipost}
      MYSQL_USER: ${DB_USER:-omnipost_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_change_me}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_change_me}"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    env_file:
      - .env 
    container_name: omnipost_web
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - DJANGO_DEBUG=${DEBUG:-True}
      - DB_NAME=${DB_NAME:-omnipost}
      - DB_USER=${DB_USER:-omnipost_user}
      - DB_PASSWORD=${DB_PASSWORD:-change_me}
      - DB_HOST=db
      - DB_PORT=3306
      - UPLOAD_ROOT=/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

